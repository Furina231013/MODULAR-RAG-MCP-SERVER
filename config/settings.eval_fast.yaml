# Fast evaluation baseline for demo.pdf
# Uses deterministic retrieval metrics only, so it can serve as a practical
# day-to-day regression baseline. For deeper LLM-as-judge evaluation, keep using
# config/settings.yaml with the composite backend.

llm:
  provider: "openai"
  model: "qwen/qwen3-vl-8b"
  deployment_name:
  azure_endpoint:
  api_version:
  api_key: "lm-studio"
  base_url: "http://127.0.0.1:1234/v1"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "openai"
  model: "text-embedding-nomic-embed-text-v1.5"
  dimensions: 768
  azure_endpoint:
  deployment_name:
  api_version:
  api_key: "lm-studio"
  base_url: "http://127.0.0.1:1234/v1"

vision_llm:
  enabled: false
  provider: "openai"
  model: "qwen/qwen3-vl-8b"
  azure_endpoint:
  deployment_name:
  api_version:
  api_key: "lm-studio"
  base_url: "http://127.0.0.1:1234/v1"
  max_image_size: 2048

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "demo"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: "none"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

evaluation:
  enabled: true
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 100
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
